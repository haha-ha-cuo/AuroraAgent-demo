[package]
name = "demo-desktop"
version = "0.1.0"
description = "Demo CodeX-like AI Agent 桌面壳（Tauri 2）"
edition = "2021"

[lib]
name = "demo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 阶段 C/D 按需引入（sidecar 监督已用 std::process，暂不依赖插件）：
# tauri-plugin-shell、tauri-plugin-dialog、tauri-plugin-single-instance、
# tauri-plugin-updater、keyring（钥匙串）。
