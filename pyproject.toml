[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demo-agent"
version = "0.1.0"
description = "形如 CodeX 的全平台桌面 AI Agent 应用"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["demo_agent"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 160
target-version = "py313"
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]
